name: Migration Safety

on:
  pull_request:
    paths:
      - 'migrations/*.sql'
      - 'scripts/check-migrations.mjs'
      - 'scripts/d1-migration-helpers.mjs'
      - '.github/workflows/migration-safety.yml'
  push:
    branches:
      - main
    paths:
      - 'migrations/*.sql'
      - 'scripts/check-migrations.mjs'
      - 'scripts/d1-migration-helpers.mjs'
      - '.github/workflows/migration-safety.yml'

permissions:
  contents: read

jobs:
  check-migrations:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Determine changed migration files
        id: changes
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          fi

          files=$(git diff --name-only "$base" "$head" -- 'migrations/*.sql' | tr '\n' ' ' | xargs)
          echo "files=$files" >> "$GITHUB_OUTPUT"

      - name: Check changed migrations
        if: steps.changes.outputs.files != ''
        env:
          FILES: ${{ steps.changes.outputs.files }}
        # Unquoted on purpose: FILES is a space-separated list of paths. set -f stops glob expansion.
        run: |
          set -f
          node scripts/check-migrations.mjs $FILES

      - name: No migration changes
        if: steps.changes.outputs.files == ''
        run: echo "No migration file changes detected."