name = "hidden-lodge-website"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]
main = "src/worker.ts"
workers_dev = true
preview_urls = false
routes = [{ pattern = "hidden-lodge.com/*", zone_name = "hidden-lodge.com" }]

[assets]
binding = "ASSETS"

[triggers]
# UTC; stagger each leg to avoid simultaneous Blizzard/WCL load.
crons = ["0,15,30,45 * * * *", "5,20,35,50 * * * *", "10 */2 * * *"]

[observability]
enabled = true

[observability.traces]
enabled = true

[vars]
WOWSIM_APP_BASE_URL = "http://lodgesim.tplinkdns.com:5050"
WOWSIM_APP_TRIGGER_PATH = "/api/jobs/start"
WOWSIM_APP_STATUS_PATH = "/api/jobs/{job_id}"

[[d1_databases]]
binding = "DB"
database_name = "hidden-lodge-db"
# Replace this with the ID from: npx wrangler d1 create hidden-lodge-db
database_id = "f51db21f-954c-4845-a829-a6900f5be5c3"
